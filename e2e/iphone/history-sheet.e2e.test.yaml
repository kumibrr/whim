appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- swipe:
    start: 50%, 70%
    end: 50%, 67%
    duration: 800
- assertNotVisible:
    id: history-sheet
- swipe:
    start: 50%, 85%
    end: 50%, 30%
    duration: 600
- assertVisible:
    id: history-sheet
- assertVisible:
    id: history-close
    childOf:
      id: Previous notes
# A canceled dismissal preserves the modal's filter and content.
- tapOn: Failed filter
- assertVisible: No Notes here yet. Capture a thought.
- swipe:
    start: 50%, 10%
    end: 50%, 12%
    duration: 1000
- assertVisible:
    id: history-sheet
- assertVisible: No Notes here yet. Capture a thought.
- tapOn: All filter
- swipe:
    start: 50%, 80%
    end: 50%, 45%
    duration: 600
- assertVisible:
    id: history-sheet
- swipe:
    from:
      text: Previous notes
    direction: DOWN
    duration: 600
- assertNotVisible:
    id: history-sheet
- assertVisible:
    id: history-hint
- tapOn:
    id: history-hint
- assertVisible:
    id: history-sheet
- tapOn: Close history
- assertNotVisible:
    id: history-sheet
- assertVisible:
    id: history-hint
