appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: settings-webhook
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- tapOn:
    id: BackButton
- tapOn:
    id: settings-audio
- tapOn:
    id: retention-picker
- tapOn: Immediately
- tapOn: Save settings
- assertVisible:
    text: Save settings
    enabled: false
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open .*Sent.*Audio expired.*'
    timeout: 30000
- assertVisible:
    id: note-play-.*
    enabled: false
- tapOn:
    id: note-row-.*
- assertVisible:
    id: note-detail
- assertVisible:
    id: note-play-.*
    enabled: false
- assertNotVisible: 'Local audio error:.*'
- tapOn:
    id: note-delete
- assertVisible: No Notes here yet. Capture a thought.
