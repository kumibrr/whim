appId: app.whim.ios
---
- evalScript: '${http.post(WHIM_WEBHOOK_RESET_URL, {body: ""})}'
- launchApp:
    clearState: true
    permissions:
      all: deny
      microphone: unset
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- assertVisible: .*stores voice Notes locally.*
- assertVisible: Step 1 of 4
- assertVisible: .*Use complications, or add Whim to the Smart Stack.*
- assertNotVisible:
    id: startup-error
- tapOn: Get started
- assertVisible: Step 2 of 4
- assertVisible: (?s).*Your workflow,.*directly.*
- tapOn:
    id: onboarding-back
- assertVisible: Get started
- tapOn: Get started
- assertNotVisible:
    id: webhook-bearer-token
- scrollUntilVisible:
    element: Authentication & headers
    direction: DOWN
- tapOn: Authentication & headers
- scrollUntilVisible:
    element:
      id: webhook-bearer-token
    direction: DOWN
- assertVisible:
    id: webhook-bearer-token
- tapOn: Authentication & headers
- assertNotVisible:
    id: webhook-bearer-token
- scrollUntilVisible:
    element: Continue to microphone
    direction: DOWN
    centerElement: false
- tapOn: Continue to microphone
- assertVisible: Step 3 of 4
- assertVisible: Always ready to record
# The explanation must lead to the system prompt, with no custom opt-out.
- assertNotVisible: Allow microphone
- assertNotVisible: Continue without microphone
- assertNotVisible:
    id: onboarding-back
- assertVisible: Continue
- tapOn: Continue
- assertVisible: Don.t Allow
- tapOn: Don.t Allow
- assertVisible:
    id: quick-capture-setup
- assertNotVisible: Start using Whim
- tapOn: Skip for now
- runFlow: flows/skip-watch-setup.yaml
- assertVisible: .*Microphone access is required.*
- assertVisible:
    id: whim-home
- assertVisible:
    id: startup-error
- tapOn:
    id: settings-button
- assertVisible: Webhook
- assertNotVisible:
    id: startup-error
- tapOn:
    id: BackButton
- assertVisible:
    id: startup-error
- swipe:
    start: 50%, 11%
    end: 50%, 3%
    duration: 400
- assertNotVisible:
    id: startup-error
- assertNotVisible:
    id: history-sheet
- assertVisible: "1 notification"
- tapOn:
    id: error-notifications
- assertVisible:
    id: startup-error
- tapOn:
    id: startup-error
# Simulator Settings may open its root while the app entry is still registering.
- assertVisible: Whim|Settings
