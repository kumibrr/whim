appId: app.whim.ios
---
- evalScript: '${http.post(WHIM_WEBHOOK_RESET_URL, {body: ""})}'
- launchApp:
    clearState: true
    arguments:
      -EXDevMenuDisableAutoLaunch: true
    permissions:
      all: deny
- openLink:
    link: ${EXPO_DEV_CLIENT_URL}
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Open
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- assertVisible: .*stores voice Notes locally.*
- tapOn: Get started
- scrollUntilVisible:
    element: Skip webhook setup
    direction: DOWN
    centerElement: true
- tapOn: Skip webhook setup
- assertVisible: .*Microphone access is denied.*
- tapOn: Continue without microphone
- assertVisible:
    id: whim-home
- assertVisible: Microphone settings
