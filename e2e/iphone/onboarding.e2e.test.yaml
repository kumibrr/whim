appId: app.whim.ios
---
- evalScript: '${http.post(WHIM_WEBHOOK_RESET_URL, {body: ""})}'
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- assertVisible: .*stores voice Notes locally.*
- assertVisible: Step 1 of 3
- assertNotVisible:
    id: startup-error
- tapOn: Get started
- assertVisible: Step 2 of 3
- tapOn:
    id: onboarding-back
- assertVisible: Get started
- tapOn: Get started
- assertNotVisible:
    id: webhook-bearer-token
- scrollUntilVisible:
    element: Authentication & headers
    direction: DOWN
- tapOn: Authentication & headers
- scrollUntilVisible:
    element:
      id: webhook-bearer-token
    direction: DOWN
- assertVisible:
    id: webhook-bearer-token
- tapOn: Authentication & headers
- assertNotVisible:
    id: webhook-bearer-token
- scrollUntilVisible:
    element: Skip webhook setup
    direction: DOWN
    centerElement: true
- tapOn: Skip webhook setup
- assertVisible: Step 3 of 3
- tapOn:
    id: onboarding-back
- assertVisible: Step 2 of 3
- tapOn: Skip webhook setup
# Some simulator launches leave permission undecided despite the launch override.
- runFlow:
    when:
      visible: Allow microphone
    commands:
      - tapOn: Allow microphone
      - tapOn: Don't Allow
- runFlow:
    when:
      visible: Continue without microphone
    commands:
      - tapOn: Continue without microphone
- assertVisible: .*Microphone access is required.*
- assertVisible:
    id: whim-home
- assertVisible:
    id: startup-error
- tapOn:
    id: settings-button
- assertVisible: Webhook
- assertNotVisible:
    id: startup-error
- tapOn:
    id: BackButton
- assertVisible:
    id: startup-error
- swipe:
    start: 50%, 11%
    end: 50%, 3%
    duration: 400
- assertNotVisible:
    id: startup-error
- assertNotVisible:
    id: history-sheet
- assertVisible: "1 notification"
- tapOn:
    id: error-notifications
- assertVisible:
    id: startup-error
- tapOn:
    id: startup-error
# Simulator Settings may open its root while the app entry is still registering.
- assertVisible: Whim|Settings
