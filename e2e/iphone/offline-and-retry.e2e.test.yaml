appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- tapOn:
    text: Back
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
      -WhimFixtureOffline: 'yes'
- extendedWaitUntil:
    visible:
      id: record-button
    timeout: 60000
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: history-hint
- assertVisible: 'Open .*Queued.*'
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open .*Sent.*'
    timeout: 60000
