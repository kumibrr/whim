appId: app.whim.ios
---
- launchApp:
    clearState: true
    permissions:
      all: deny
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- tapOn: Get started
- tapOn: Continue to microphone
- assertVisible: Step 3 of 4
- tapOn: Open system settings
# Permission changes can terminate Whim. Grant access and cold-launch without clearing data.
- stopApp: app.whim.ios
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: Continue to setup
    timeout: 60000
- assertVisible: Step 3 of 4
- assertVisible: Always ready to record
- tapOn: Continue to setup
- assertVisible: Step 4 of 4
- stopApp: app.whim.ios
- launchApp
- assertVisible:
    id: quick-capture-setup
- assertNotVisible: Start using Whim
- tapOn: Skip for now
- runFlow: flows/skip-watch-setup.yaml
- assertVisible:
    id: whim-home
- tapOn:
    id: settings-button
- scrollUntilVisible:
    element: Reset Whim
    direction: DOWN
    centerElement: true
- tapOn: Reset Whim
- tapOn: Confirm reset
- assertVisible: Get started
- assertVisible: Step 1 of 4
