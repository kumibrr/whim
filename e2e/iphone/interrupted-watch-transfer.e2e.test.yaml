appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: settings-webhook
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
# Seed the persisted state left by an old build interrupted during a peer copy.
# Only the system peer boundary is replaced; recovery, delivery and playback are real.
- stopApp
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_PEER_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
      -WhimPeerScenario: interrupted-pending
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open New Watch Note,.*Sent'
    timeout: 30000
- assertNotVisible:
    id: startup-error
- assertTrue:
    condition: ${json(http.get(WHIM_WEBHOOK_TEST_URL.replace('/receive', '/state')).body).received.length === 1}
    label: A broken pending transfer does not block another Watch Note's Delivery
# Relaunch without reseeding: recovery must keep working with the old remnant.
- stopApp
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_PEER_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open New Watch Note,.*Sent'
    timeout: 30000
- assertNotVisible:
    id: startup-error
# A later resend repairs the interrupted Note and makes it playable and deliverable.
- stopApp
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_PEER_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
      -WhimPeerScenario: resend-interrupted
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open Interrupted Watch Note,.*Sent'
    timeout: 30000
- tapOn:
    id: note-row-09000000-0000-0000-0000-000000000003
- tapOn:
    id: note-play-.*
    childOf:
      id: note-detail
- assertVisible:
    id: note-stop-.*
- assertNotVisible:
    id: startup-error
- assertTrue:
    condition: ${json(http.get(WHIM_WEBHOOK_TEST_URL.replace('/receive', '/state')).body).received.length === 2}
    label: Both Watch Notes reach the real receiver
