appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- assertVisible:
    id: preferences
- assertNotVisible:
    id: settings-webhook-errors
- tapOn:
    id: settings-webhook
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- evalScript: '${http.post(WHIM_WEBHOOK_RESPONSE_URL, {headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: 200, delay_ms: 3000})})}'
- tapOn: Test webhook
- assertVisible:
    id: webhook-test-progress
- extendedWaitUntil:
    visible: Test passed. Idempotency confirmed.
    timeout: 15000
- assertNotVisible:
    id: webhook-test-progress
- evalScript: '${http.post(WHIM_WEBHOOK_RESPONSE_URL, {headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: 200})})}'
# Empty blur preserves a saved bearer token; empty Return explicitly removes it.
- tapOn:
    id: webhook-bearer-token
- inputText: temporary-test-token
- tapOn:
    id: webhook-keyboard-done
- tapOn: Save settings
- assertVisible: 'Bearer token · Saved .*'
- assertNotVisible: Clear bearer token
- tapOn:
    id: webhook-bearer-token
- tapOn:
    id: webhook-keyboard-done
- assertVisible: 'Bearer token · Saved .*'
- tapOn:
    id: webhook-bearer-token
- pressKey: Enter
- extendedWaitUntil:
    notVisible: 'Bearer token · Saved .*'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: shortcut-webhook-errors
    direction: DOWN
- tapOn:
    id: shortcut-webhook-errors
- assertVisible: No webhook errors.
- assertNotVisible: Webhook settings
- assertNotVisible:
    id: shortcut-webhook
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
- tapOn:
    id: settings-audio
- assertVisible: Keep audio after delivery
- tapOn:
    id: retention-picker
- tapOn: Never
- tapOn: Save settings
- assertVisible:
    text: Save settings
    enabled: false
- tapOn:
    id: BackButton
- tapOn:
    id: settings-titles
- assertVisible: Transcription enabled
- tapOn:
    id: BackButton
- tapOn:
    id: settings-permissions
- assertVisible: Microphone
- tapOn:
    id: BackButton
- tapOn:
    id: settings-watch
- assertVisible: 'Watch synchronization (available|unavailable).'
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element: Reset Whim
    direction: DOWN
    centerElement: true
- tapOn: Reset Whim
- assertVisible: Reset Whim on this iPhone?
- assertNotVisible: Sheet Grabber
- tapOn: Cancel
- assertVisible:
    id: preferences
- tapOn: Reset Whim
- tapOn: Confirm reset
- assertVisible: Get started
