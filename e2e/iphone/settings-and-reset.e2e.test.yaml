appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Webhook
- scrollUntilVisible:
    element: Save webhook
    direction: DOWN
    centerElement: true
- tapOn: Save webhook
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- tapOn: Test webhook
- extendedWaitUntil:
    visible: Test passed. Idempotency confirmed.
    timeout: 15000
- scrollUntilVisible:
    element: Audio retention
    direction: DOWN
    centerElement: true
- assertVisible: Keep audio after delivery
- scrollUntilVisible:
    element: 'Keep audio: Never'
    direction: DOWN
    centerElement: true
- tapOn: 'Keep audio: Never'
- scrollUntilVisible:
    element: On-device titles
    direction: DOWN
    centerElement: true
- assertVisible: Transcription enabled
- scrollUntilVisible:
    element: Permissions
    direction: DOWN
    centerElement: true
- scrollUntilVisible:
    element: Apple Watch
    direction: DOWN
    centerElement: true
- assertVisible: 'Watch synchronization (available|unavailable).'
- scrollUntilVisible:
    element: Reset Whim
    direction: DOWN
    centerElement: true
- assertVisible: Reset
- tapOn: Reset Whim
- tapOn: Cancel
- tapOn: Reset Whim
- tapOn: Confirm reset
- assertVisible: Get started
