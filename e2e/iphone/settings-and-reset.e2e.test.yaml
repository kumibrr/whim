appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- assertVisible:
    id: preferences
- tapOn:
    id: settings-webhook
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- tapOn: Test webhook
- extendedWaitUntil:
    visible: Test passed. Idempotency confirmed.
    timeout: 15000
- tapOn:
    id: BackButton
- tapOn:
    id: settings-audio
- assertVisible: Keep audio after delivery
- tapOn:
    id: retention-picker
- tapOn: Never
- tapOn: Save settings
- assertVisible:
    text: Save settings
    enabled: false
- tapOn:
    id: BackButton
- tapOn:
    id: settings-titles
- assertVisible: Transcription enabled
- tapOn:
    id: BackButton
- tapOn:
    id: settings-permissions
- assertVisible: Microphone
- tapOn:
    id: BackButton
- tapOn:
    id: settings-watch
- assertVisible: 'Watch synchronization (available|unavailable).'
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element: Reset Whim
    direction: DOWN
    centerElement: true
- tapOn: Reset Whim
- tapOn: Cancel
- tapOn: Reset Whim
- tapOn: Confirm reset
- assertVisible: Get started
