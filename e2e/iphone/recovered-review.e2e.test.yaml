appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Webhook
- scrollUntilVisible:
    element: Save webhook
    direction: DOWN
    centerElement: true
- tapOn: Save webhook
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- tapOn:
    id: BackButton
- tapOn:
    id: record-button
- assertVisible:
    id: recorder-panel
# Terminate with a persisted Recording Session and audio, without finalizing it.
- stopApp
- launchApp:
    arguments:
      -EXDevMenuDisableAutoLaunch: true
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
- extendedWaitUntil:
    visible: 'Open .*Review required.*'
    timeout: 60000
- tapOn:
    id: note-row-.*
- assertVisible: Review required
- assertVisible: No Attempts yet.
- assertTrue:
    condition: ${json(http.get(WHIM_WEBHOOK_TEST_URL.replace('/receive', '/state')).body).received.length === 0}
    label: Recovery does not deliver the Note to the configured destination
- tapOn: Review recording
- assertVisible: Playing
- tapOn: Stop playback
- extendedWaitUntil:
    notVisible: Playing
    timeout: 10000
- assertVisible: Review recording
- assertVisible: Review required
- assertTrue:
    condition: ${json(http.get(WHIM_WEBHOOK_TEST_URL.replace('/receive', '/state')).body).received.length === 0}
    label: Reviewing audio does not authorize Delivery
- scrollUntilVisible:
    element: Send Note
    direction: DOWN
    centerElement: true
- tapOn: Send Note
- extendedWaitUntil:
    visible: '✓ Sent'
    timeout: 60000
- assertNotVisible: Review required
- assertTrue:
    condition: ${json(http.get(WHIM_WEBHOOK_TEST_URL.replace('/receive', '/state')).body).received.length === 1}
    label: Explicit Send delivers the recovered Note once
