appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- evalScript: '${http.post(WHIM_WEBHOOK_RESPONSE_URL, {headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: 400})})}'
- tapOn: Settings
- tapOn:
    id: settings-webhook
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
# Configuration-test failures are visible without creating a Note.
- tapOn: Test webhook
- extendedWaitUntil:
    visible: 'Test failed.*HTTP 400.*View webhook errors.*'
    timeout: 15000
- tapOn: View webhook errors
- assertVisible: Configuration test
- assertVisible: '⚠ HTTP 400'
- assertVisible:
    id: webhook-error-message
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
- tapOn:
    id: BackButton
- tapOn:
    id: record-button
- tapOn:
    id: stop-recording
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open .*Failed.*'
    timeout: 60000
- tapOn:
    id: note-row-.*
- assertVisible:
    id: note-detail
- assertVisible: '⚠ Failed · HTTP 400'
- assertVisible: The destination rejected this Attempt.
# The native back button takes its label from the history navigation title.
- tapOn:
    id: BackButton
- tapOn: Close history
- tapOn: Settings
- tapOn:
    id: settings-webhook
- tapOn: View webhook errors
- assertVisible: '⚠ HTTP 400'
- assertVisible:
    id: webhook-error-message
    text: '.*note_id.*'
- assertNotVisible: Webhook settings
- tapOn:
    id: BackButton
- tapOn:
    id: webhook-url
- inputText: https://whim-fixture.invalid/receive
- tapOn:
    id: webhook-bearer-token
- inputText: repaired-fixture-token
- tapOn: Save settings
- extendedWaitUntil:
    visible: Webhook saved. Test it to check delivery.
    timeout: 10000
- evalScript: '${http.post(WHIM_WEBHOOK_RESPONSE_URL, {headers: {"Content-Type": "application/json"}, body: JSON.stringify({status: 200})})}'
- scrollUntilVisible:
    element: Retry unsent Notes
    direction: DOWN
    centerElement: true
- tapOn: Retry unsent Notes
# Back from errors already returned to Webhook; only Settings and Home remain.
- tapOn:
    id: BackButton
- assertVisible:
    id: preferences
- tapOn:
    id: BackButton
- assertVisible:
    id: whim-home
- tapOn:
    id: history-hint
- extendedWaitUntil:
    visible: 'Open .*Sent.*'
    timeout: 60000
- tapOn:
    id: note-row-.*
- scrollUntilVisible:
    element: '✓ Sent · HTTP 200'
    direction: DOWN
    centerElement: true
- assertVisible: https://whim-fixture.invalid/receive
