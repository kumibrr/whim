- tapOn: Keep recording
- assertVisible: Stop recording
- tapOn:
    id: stop-recording
- assertVisible: Note saved
- assertNotVisible:
    id: history-sheet
- tapOn:
    id: history-hint
- assertVisible: 'Open .*Setup required.*'
- tapOn:
    id: note-play-.*
- assertVisible:
    id: note-stop-.*
- tapOn:
    id: note-stop-.*
- tapOn:
    id: note-row-.*
- tapOn: Play Note
- assertVisible: Playing
- tapOn: Stop playback
- tapOn: Delete Note
- assertVisible: .*only local copy.*
- tapOn: Confirm delete
- assertVisible: No Notes here yet. Capture a thought.
- tapOn: Close history
- tapOn:
    id: record-button
- tapOn: Discard recording
