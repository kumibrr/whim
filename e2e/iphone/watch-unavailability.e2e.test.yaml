appId: app.whim.ios
---
- runFlow: flows/clean-launch.yaml
- tapOn: Settings
- tapOn:
    id: settings-watch
- scrollUntilVisible:
    element: Watch synchronization unavailable.
    direction: DOWN
- assertVisible:
    id: watch-unavailability-reason
- stopApp
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
      -WhimPeerScenario: watch-app-not-installed
- extendedWaitUntil:
    visible:
      id: whim-home
    timeout: 30000
- tapOn: Settings
- tapOn:
    id: settings-watch
- scrollUntilVisible:
    element:
      id: watch-unavailability-reason
    direction: DOWN
- assertVisible:
    id: watch-unavailability-reason
    text: 'iOS reports that Whim is not installed on your Apple Watch\.'

- assertVisible:
    id: watch-unavailability-recovery
- scrollUntilVisible:
    element:
      id: watch-technical-details
    direction: DOWN
- tapOn:
    id: watch-technical-details
- scrollUntilVisible:
    element: Whim installed on Watch
    direction: DOWN
- assertVisible: 'No'
- stopApp
- launchApp:
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
      -WhimPeerScenario: watch-connection-activation-failed
- extendedWaitUntil:
    visible:
      id: whim-home
    timeout: 30000
- tapOn: Settings
- tapOn:
    id: settings-watch
- scrollUntilVisible:
    element:
      id: watch-technical-details
    direction: DOWN
- assertVisible: 'iOS could not start the Watch connection\..*'
- tapOn:
    id: watch-technical-details
- scrollUntilVisible:
    element: '7004'
    direction: DOWN
- assertVisible: WCErrorDomain
- assertVisible: '7004'
