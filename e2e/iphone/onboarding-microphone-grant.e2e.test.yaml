appId: app.whim.ios
---
- launchApp:
    clearState: true
    permissions:
      all: deny
      microphone: unset
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- tapOn: Get started
- tapOn: Continue to microphone
- assertVisible: Step 3 of 4
- tapOn: Continue
- assertVisible: Don.t Allow
# iOS versions label the affirmative system action differently.
- tapOn: Allow|OK
- assertVisible:
    id: quick-capture-setup
- assertNotVisible: Start using Whim
- tapOn: Skip for now
- runFlow: flows/skip-watch-setup.yaml
- extendedWaitUntil:
    visible:
      id: whim-home
    timeout: 10000
- assertNotVisible:
    id: startup-error
