appId: app.whim.ios
---
- evalScript: '${http.post(WHIM_WEBHOOK_RESET_URL, {body: ""})}'
- launchApp:
    clearState: true
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
    permissions:
      all: allow
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- tapOn: Get started
- scrollUntilVisible:
    element: Skip webhook setup
    direction: DOWN
    centerElement: true
- tapOn: Skip webhook setup
- runFlow:
    when:
      visible: Allow microphone
    commands:
      - tapOn: Allow microphone
      - runFlow:
          when:
            visible: Allow
          commands:
            - tapOn: Allow
      - runFlow:
          when:
            visible: OK
          commands:
            - tapOn: OK
- tapOn: Start using Whim
- extendedWaitUntil:
    visible:
      id: whim-home
    timeout: 10000
