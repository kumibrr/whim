appId: app.whim.ios
---
- evalScript: '${http.post(WHIM_WEBHOOK_RESET_URL, {body: ""})}'
- launchApp:
    clearState: true
    arguments:
      -WhimFixtureAudio: ${WHIM_FIXTURE_AUDIO}
      -WhimFixtureWebhookURL: ${WHIM_WEBHOOK_TEST_URL}
    permissions:
      all: allow
- runFlow:
    when:
      visible: Open
    commands:
      - tapOn: Cancel
- extendedWaitUntil:
    visible: Get started
    timeout: 60000
- tapOn: Get started
- assertNotVisible: Skip webhook setup
- scrollUntilVisible:
    element: Continue to microphone
    direction: DOWN
    centerElement: false
- tapOn: Continue to microphone
- extendedWaitUntil:
    visible: Always ready to record
    timeout: 60000
- runFlow:
    when:
      visible: Continue
    commands:
      - tapOn: Continue
      - runFlow:
          when:
            visible: Allow
          commands:
            - tapOn: Allow
      - runFlow:
          when:
            visible: OK
          commands:
            - tapOn: OK
# Advance to optional quick capture setup after microphone permission.
- runFlow:
    when:
      visible: Continue to setup
    commands:
      - tapOn: Continue to setup
- assertVisible:
    id: quick-capture-setup
- assertNotVisible: Start using Whim
- tapOn: Show me how
- assertVisible: Set up your Action button
- assertNotVisible: Previous
- assertNotVisible: Read again
- assertNotVisible: Skip for now
- tapOn: Continue
- runFlow: skip-watch-setup.yaml
- extendedWaitUntil:
    visible:
      id: whim-home
    timeout: 10000
